<!DOCTYPE html>
<html>
<head>
    <title>Responsive</title>

    <style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }
    
    table {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
    }
    
  </style>
</head>

<body>

    <table>
        <tr>
            <td style="background-color: lightgreen;">First cell</td>
            <td style="background-color: lightpink;">Second cell</td>
        </tr>
    </table>

</body>
</html>
